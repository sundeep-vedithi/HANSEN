[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hansen-database-exports"
version = "1.0.0"
description = "Scientific data export programs for the HANSEN Database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Sundeep Chaitanya Vedithi" }
]
keywords = [
  "Mycobacterium leprae",
  "structural biology",
  "target prioritisation",
  "protein structure",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
hansen-export = "hansen_database.export_hansen_data:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hansen_database = ["data/*.b64"]
